<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meeting Bot</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <h1>Meeting bot</h1>
      <p class="sub">Meet, Teams, or Zoom URL → Vexa join</p>

      <div id="alert" class="alert" role="alert"></div>

      <form id="joinForm" class="panel">
        <label for="meetingUrl">Meeting URL</label>
        <input
          type="url"
          id="meetingUrl"
          name="meetingUrl"
          placeholder="https://meet.google.com/abc-defg-hij"
          required
        />

        <label for="botName">Bot name <span class="muted">(optional)</span></label>
        <input type="text" id="botName" name="botName" placeholder="Central Agent Bot" />

        <label class="check">
          <input type="checkbox" id="force" name="force" />
          Force join if bot already running
        </label>

        <button type="submit" class="btn btn-primary" id="joinBtn">Join</button>
      </form>

      <section class="panel session-panel" id="sessionPanel">
        <div class="panel-head">Session</div>
        <div id="statusGrid"></div>
        <p class="poll-note" id="pollNote" hidden>Updating every 3s</p>
        <div class="row-btns">
          <button type="button" class="btn btn-ghost" id="leaveBtn">Leave</button>
        </div>
      </section>

      <section class="panel log-panel">
        <div class="panel-head">Log</div>
        <div class="log" id="log"></div>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
